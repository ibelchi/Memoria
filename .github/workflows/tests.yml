name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        shell: pwsh
        run: Get-Content -Raw -Encoding UTF8 web/app.js | node --check
